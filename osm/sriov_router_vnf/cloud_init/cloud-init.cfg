#cloud-config
ssh_pwauth: false

users:
  - name: ubuntu
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIH3Q9y768cb/EqVlscWpuEUCm3zj9Azjcq0yIqcAqjTV osm-admin@retelith.com

write_files:
  - path: /etc/sysctl.d/90-router.conf
    content: |
      net.ipv4.ip_forward=1
      net.ipv4.conf.all.rp_filter=0
      net.ipv4.conf.default.rp_filter=0
  # The two mlx5 VFs, in PCI order (= int-cpd order): upstream, then downstream
  - path: /usr/local/sbin/router-setup
    permissions: "0755"
    content: |
      #!/bin/sh
      set -e
      vfs=$(for d in /sys/class/net/*; do
              [ "$(basename "$(readlink -f "$d/device/driver" 2>/dev/null)")" = mlx5_core ] || continue
              echo "$(basename "$(readlink -f "$d/device")") $(basename "$d")"
            done | sort | awk '{print $2}')
      set -- $vfs
      ip link set "$1" up && ip addr replace 10.10.0.1/24 dev "$1"
      ip link set "$2" up && ip addr replace 10.20.0.1/24 dev "$2"
      sysctl -p /etc/sysctl.d/90-router.conf

runcmd:
  - /usr/local/sbin/router-setup
