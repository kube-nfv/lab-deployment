cluster:
  etcd:
    advertisedSubnets:
      - 100.64.0.0/10
---
# Bind control-plane component metrics to all interfaces so kube-prometheus-stack
# can scrape them over the node IP. Talos defaults these to 127.0.0.1, which makes
# the kube-controller-manager / kube-scheduler / kube-proxy targets "connection refused".
apiVersion: v1alpha1
kind: KubeControllerManagerConfig
extraArgs:
  bind-address: 0.0.0.0
---
apiVersion: v1alpha1
kind: KubeSchedulerConfig
extraArgs:
  bind-address: 0.0.0.0
---
# kube-proxy reads a config file; most command-line flags are ignored.
# Kube-OVN does not support kube-proxy's nftables mode.
apiVersion: v1alpha1
kind: KubeProxyConfig
mode: iptables
config:
  metricsBindAddress: 0.0.0.0:10249
---
# CoreDNS is deployed from k8s/coredns so it can tolerate the location taints
apiVersion: v1alpha1
kind: KubeCoreDNSConfig
enabled: false
---
apiVersion: v1alpha1
kind: KubeTalosAPIAccessConfig
allowedRoles:
  - os:reader
allowedKubernetesNamespaces:
  - kube-system
