    - 'SUBSYSTEM=="net", ACTION=="add|move", ATTRS{phys_switch_id}=="3cde3d0003c288a0", ATTR{phys_port_name}=="pf1vf13", NAME="ens9f1np1_13"'
    - 'SUBSYSTEM=="net", ACTION=="add|move", ATTRS{phys_switch_id}=="3cde3d0003c288a0", ATTR{phys_port_name}=="pf1vf14", NAME="ens9f1np1_14"'
