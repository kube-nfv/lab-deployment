machine:
  install:
    disk: /dev/sdb
  network:
    interfaces:
    - interface: ens9f0np0
      ignore: true
    - interface: ens9f1np1
      ignore: true
    - deviceSelector:
        busPath: "0000:b3:00.*"
        driver: mlx5_core
      ignore: true
  # NOTE: switchdev VF representor renaming on Talos.
  #
  # sriov-network-operator CANNOT do this renaming on Talos, for three reasons:
  #   1. Its rule uses IMPORT{program}=".../switchdev-vf-link-name.sh" which needs
  #      a shell (#!/bin/bash). Talos has no shell, so it silently fails.
  #   2. The operator writes its rules to /var/etc/udev/rules.d (via the host-etc
  #      volumeMount, since /etc is read-only on Talos), a directory udevd never
  #      scans. udevd reads /usr/lib/udev/rules.d (RO), /run/udev/rules.d, and
  #      /etc/udev/rules.d.
  #   3. The operator container has no udevadm and a separate /run, so it cannot
  #      reload/trigger the host udevd anyway.
  #
  # Solution: declare the rules statically here. Talos writes them to
  # /usr/lib/udev/rules.d/99-talos.rules; the host udevd loads them at boot and
  # applies them natively on the representor "add" event when the operator creates
  # the VFs. No shell, no IMPORT{program} — one exact-match rule per VF, with the
  # VF index taken straight from phys_port_name (pf<port>vf<N> -> NAME=<pf>_<N>).
  #
  # Enumerated for this node: switch_id 3cde3d0003c288a0, ens9f0np0 (pf0) and
  # ens9f1np1 (pf1), numVfs=18 each. If numVfs changes, regenerate this list.
  udev:
    rules:
    - 'SUBSYSTEM=="net", ACTION=="add|move", ATTRS{phys_switch_id}=="3cde3d0003c288a0", ATTR{phys_port_name}=="pf0vf0", NAME="ens9f0np0_0"'
    - 'SUBSYSTEM=="net", ACTION=="add|move", ATTRS{phys_switch_id}=="3cde3d0003c288a0", ATTR{phys_port_name}=="pf0vf1", NAME="ens9f0np0_1"'
    - 'SUBSYSTEM=="net", ACTION=="add|move", ATTRS{phys_switch_id}=="3cde3d0003c288a0", ATTR{phys_port_name}=="pf0vf2", NAME="ens9f0np0_2"'
    - 'SUBSYSTEM=="net", ACTION=="add|move", ATTRS{phys_switch_id}=="3cde3d0003c288a0", ATTR{phys_port_name}=="pf0vf3", NAME="ens9f0np0_3"'
    - 'SUBSYSTEM=="net", ACTION=="add|move", ATTRS{phys_switch_id}=="3cde3d0003c288a0", ATTR{phys_port_name}=="pf0vf4", NAME="ens9f0np0_4"'
    - 'SUBSYSTEM=="net", ACTION=="add|move", ATTRS{phys_switch_id}=="3cde3d0003c288a0", ATTR{phys_port_name}=="pf0vf5", NAME="ens9f0np0_5"'
    - 'SUBSYSTEM=="net", ACTION=="add|move", ATTRS{phys_switch_id}=="3cde3d0003c288a0", ATTR{phys_port_name}=="pf0vf6", NAME="ens9f0np0_6"'
    - 'SUBSYSTEM=="net", ACTION=="add|move", ATTRS{phys_switch_id}=="3cde3d0003c288a0", ATTR{phys_port_name}=="pf0vf7", NAME="ens9f0np0_7"'
    - 'SUBSYSTEM=="net", ACTION=="add|move", ATTRS{phys_switch_id}=="3cde3d0003c288a0", ATTR{phys_port_name}=="pf0vf8", NAME="ens9f0np0_8"'
    - 'SUBSYSTEM=="net", ACTION=="add|move", ATTRS{phys_switch_id}=="3cde3d0003c288a0", ATTR{phys_port_name}=="pf0vf9", NAME="ens9f0np0_9"'
    - 'SUBSYSTEM=="net", ACTION=="add|move", ATTRS{phys_switch_id}=="3cde3d0003c288a0", ATTR{phys_port_name}=="pf0vf10", NAME="ens9f0np0_10"'
    - 'SUBSYSTEM=="net", ACTION=="add|move", ATTRS{phys_switch_id}=="3cde3d0003c288a0", ATTR{phys_port_name}=="pf0vf11", NAME="ens9f0np0_11"'
    - 'SUBSYSTEM=="net", ACTION=="add|move", ATTRS{phys_switch_id}=="3cde3d0003c288a0", ATTR{phys_port_name}=="pf0vf12", NAME="ens9f0np0_12"'
    - 'SUBSYSTEM=="net", ACTION=="add|move", ATTRS{phys_switch_id}=="3cde3d0003c288a0", ATTR{phys_port_name}=="pf0vf13", NAME="ens9f0np0_13"'
    - 'SUBSYSTEM=="net", ACTION=="add|move", ATTRS{phys_switch_id}=="3cde3d0003c288a0", ATTR{phys_port_name}=="pf0vf14", NAME="ens9f0np0_14"'
    - 'SUBSYSTEM=="net", ACTION=="add|move", ATTRS{phys_switch_id}=="3cde3d0003c288a0", ATTR{phys_port_name}=="pf0vf15", NAME="ens9f0np0_15"'
