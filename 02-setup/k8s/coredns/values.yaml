coredns:
  service:
    # kubelet clusterDNS
    clusterIP: 10.96.0.10
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
    - key: node.cloudprovider.kubernetes.io/uninitialized
      operator: Exists
      effect: NoSchedule
    - key: node.kubernetes.io/location
      operator: Exists
      effect: NoSchedule
