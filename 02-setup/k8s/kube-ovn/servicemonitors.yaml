# Kube-OVN ServiceMonitors, per https://kubeovn.github.io/docs/stable/en/guide/prometheus-grafana/
# Metrics are plain HTTP (deployment runs with --secure-serving=false); the bearer
# token is harmless. The release=monitoring label is required for this cluster's
# kube-prometheus-stack Prometheus to select them.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kube-ovn-cni
  namespace: monitoring
  labels:
    release: monitoring
spec:
  endpoints:
    - port: metrics
      interval: 15s
      bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
  namespaceSelector:
    matchNames:
      - kube-system
  selector:
    matchLabels:
      app: kube-ovn-cni
---
