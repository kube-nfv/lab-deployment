# KubeVirt exposes metrics over HTTPS (self-signed) on the kubevirt-prometheus-metrics
# service; insecureSkipVerify handles the self-signed cert. release=monitoring is
# required for this cluster's kube-prometheus-stack Prometheus to select the SM.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kubevirt
  namespace: monitoring
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
      - kubevirt
  selector:
    matchLabels:
      prometheus.kubevirt.io: "true"
  endpoints:
    - port: metrics
      scheme: https
      interval: 30s
      tlsConfig:
        insecureSkipVerify: true
      honorLabels: true
