# CDI's own ServiceMonitor (service-monitor-cdi) is created by the cdi-operator
# without the release=monitoring label this cluster's Prometheus selects on, and
# the operator reverts manual edits. Provide our own SM instead (same selector /
# https + insecureSkipVerify as the operator's).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cdi
  namespace: monitoring
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
      - cdi
  selector:
    matchLabels:
      prometheus.cdi.kubevirt.io: "true"
  endpoints:
    - port: metrics
      scheme: https
      interval: 30s
      tlsConfig:
        insecureSkipVerify: true
