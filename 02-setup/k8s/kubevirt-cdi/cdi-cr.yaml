apiVersion: cdi.kubevirt.io/v1beta1
kind: CDI
metadata:
  name: cdi
spec:
  config:
    scratchSpaceStorageClass: local
    # Default 600M memory limit OOMKills the upload server on block-volume clones: dirty page cache fills it
    podResourceRequirements:
      requests:
        cpu: 100m
        memory: 60M
      limits:
        cpu: 750m
        memory: 2Gi
    featureGates:
    - HonorWaitForFirstConsumer
    - WebhookPvcRendering
  imagePullPolicy: IfNotPresent
  infra:
    nodeSelector:
      kubernetes.io/os: linux
      node.kubernetes.io/location: cloud
    tolerations:
    - key: CriticalAddonsOnly
      operator: Exists
    - key: node.kubernetes.io/location
      operator: Equal
      value: cloud
      effect: NoSchedule
  workload:
    nodeSelector:
      kubernetes.io/os: linux
      node.kubernetes.io/location: edge
    tolerations:
    - key: node.kubernetes.io/location
      operator: Equal
      value: edge
      effect: NoSchedule
