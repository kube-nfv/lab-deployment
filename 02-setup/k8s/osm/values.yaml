osm:
  global:
    hostname: "tailac05db.ts.net"
    ingressClassName: tailscale
    tailscaleProxyClass: default-proxy-class
    gitops:
      enabled: true
      gitUser: osm-developer
      gitBaseUrl: http://gitea-http.gitea.svc.cluster.local:3000
      fleetRepoUrl: http://gitea-http.gitea.svc.cluster.local:3000/osm-developer/fleet-osm
      swcatalogsRepoUrl: http://gitea-http.gitea.svc.cluster.local:3000/osm-developer/sw-catalogs-osm
      mgmtcluster:
        secretName: mgmtcluster-secret
        secretKey: kubeconfig
      auxcluster:
        secretName: auxcluster-secret
        secretKey: kubeconfig
    nodeSelector:
      node.kubernetes.io/location: cloud
    tolerations:
      - key: node.kubernetes.io/location
        operator: Equal
        value: cloud
        effect: NoSchedule

  mongodb:
    nodeSelector:
      node.kubernetes.io/location: cloud
    tolerations:
      - key: node.kubernetes.io/location
        operator: Equal
        value: cloud
        effect: NoSchedule
    arbiter:
      nodeSelector:
        node.kubernetes.io/location: cloud
      tolerations:
        - key: node.kubernetes.io/location
          operator: Equal
          value: cloud
          effect: NoSchedule
    persistence:
      storageClass: "pd-standard"
      size: 8Gi

  kafka:
    controller:
      nodeSelector:
        node.kubernetes.io/location: cloud
      tolerations:
        - key: node.kubernetes.io/location
          operator: Equal
          value: cloud
          effect: NoSchedule
      persistence:
        storageClass: "pd-standard"
        size: 8Gi
    zookeeper:
      nodeSelector:
        node.kubernetes.io/location: cloud
      tolerations:
        - key: node.kubernetes.io/location
          operator: Equal
          value: cloud
          effect: NoSchedule
      persistence:
        storageClass: "pd-standard"

  mysql:
    primary:
      nodeSelector:
        node.kubernetes.io/location: cloud
      tolerations:
        - key: node.kubernetes.io/location
          operator: Equal
          value: cloud
          effect: NoSchedule
      persistence:
        storageClass: "pd-standard"

  prometheus:
    kube-state-metrics:
      nodeSelector:
        node.kubernetes.io/location: cloud
      tolerations:
        - key: node.kubernetes.io/location
          operator: Equal
          value: cloud
          effect: NoSchedule
    server:
      nodeSelector:
        node.kubernetes.io/location: cloud
      tolerations:
        - key: node.kubernetes.io/location
          operator: Equal
          value: cloud
          effect: NoSchedule
      persistentVolume:
        storageClass: "pd-standard"
        size: 8Gi
      ingress:
        enabled: false
    alertmanager:
      nodeSelector:
        node.kubernetes.io/location: cloud
      tolerations:
        - key: node.kubernetes.io/location
          operator: Equal
          value: cloud
          effect: NoSchedule
      persistence:
        storageClass: "pd-standard"
    prometheus-pushgateway:
      nodeSelector:
        node.kubernetes.io/location: cloud
      tolerations:
        - key: node.kubernetes.io/location
          operator: Equal
          value: cloud
          effect: NoSchedule

  grafana:
    enabled: false
  ro:
    image:
      repository: ghcr.io/kube-nfv/osm-ro
      tag: master-d9ca4ca
      pullPolicy: IfNotPresent
    # Attach RO to the kube-vim-managed shared mgmt subnet so it can SSH into
    # VMs at their mgmt IPs (inject_ssh_key). The two annotations work together:
    # the first tells Multus which NAD to use; the second tells kube-OVN which
    # logical switch backs it (without it kube-OVN falls back to ovn-default).
    # See kube-vim/docs/management-network.md.
    podAnnotations:
      k8s.v1.cni.cncf.io/networks: kube-vim/osm-mgmt-subnet-0-netattach
      osm-mgmt-subnet-0-netattach.kube-vim.ovn.kubernetes.io/logical_switch: osm-mgmt-subnet-0

  # Upstream testing-daily builds pinned by digest (2026-09-14).
  lcm:
    image:
      tag: testing-daily@sha256:73ebed6b78c68ade6a38bc5c55356204de5e6a6f8b29016143ed4a673b874f79

  mon:
    image:
      tag: testing-daily@sha256:270cf1ced84b68828a00f21c6bca22fbc4c5ffd8afa0f0327ea61e46fe68fa74
    grafanaSecretName: "grafana-monitoring"
    config:
      OSMMON_GRAFANA_URL: "http://grafana.monitoring.svc.cluster.local:80"

  nbi:
    image:
      tag: testing-daily@sha256:8be51834d3c18eeec419c7968b072bea77b58e044176ed0cef3d14a341fbd62e
    ingress:
      host: "setup02-nbi.tailac05db.ts.net"

  ngui:
    image:
      repository: ghcr.io/retelith/osm-ngui
      tag: dev-bb7fc21
      pullPolicy: Always
    config:
      grafanaUrl: "https://setup02-mon-grafana.tailac05db.ts.net"
    ingress:
      host: "setup02-gui.tailac05db.ts.net"

  alertmanager:
    ingress:
      host: "setup02-alertmanager.tailac05db.ts.net"

  webhookTranslator:
    ingress:
      host: "setup02-webhook.tailac05db.ts.net"

  airflow:
    defaultAirflowRepository: ghcr.io/kube-nfv/osm-ng-sa
    defaultAirflowTag: "v1.19.0"
    ingress:
      web:
        ingressClassName: tailscale
        annotations:
          tailscale.com/proxy-class: default-proxy-class
        host: "setup02-airflow.tailac05db.ts.net"
        tls:
          enabled: true
          secretName: airflow-cert
        path: /
        pathType: Prefix
    nodeSelector:
      node.kubernetes.io/location: cloud
    tolerations:
      - key: node.kubernetes.io/location
        operator: Equal
        value: cloud
        effect: NoSchedule
    scheduler:
      nodeSelector:
        node.kubernetes.io/location: cloud
      tolerations:
        - key: node.kubernetes.io/location
          operator: Equal
          value: cloud
          effect: NoSchedule
      # 15-day default fills the 2Gi logs PVC.
      logGroomerSidecar:
        retentionDays: 3
    webserver:
      nodeSelector:
        node.kubernetes.io/location: cloud
      tolerations:
        - key: node.kubernetes.io/location
          operator: Equal
          value: cloud
          effect: NoSchedule
    triggerer:
      nodeSelector:
        node.kubernetes.io/location: cloud
      tolerations:
        - key: node.kubernetes.io/location
          operator: Equal
          value: cloud
          effect: NoSchedule
    workers:
      nodeSelector:
        node.kubernetes.io/location: cloud
      tolerations:
        - key: node.kubernetes.io/location
          operator: Equal
          value: cloud
          effect: NoSchedule
      persistence:
        storageClassName: "pd-standard"
    postgresql:
      primary:
        nodeSelector:
          node.kubernetes.io/location: cloud
        tolerations:
          - key: node.kubernetes.io/location
            operator: Equal
            value: cloud
            effect: NoSchedule
        persistence:
          storageClass: "pd-standard"
