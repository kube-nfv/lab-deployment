apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: keycloak
spec:
  secretName: keycloak-tls
  privateKey:
    algorithm: ECDSA
    size: 256
  dnsNames:
    - keycloak-service
    - keycloak-service.keycloak.svc
    - keycloak-service.keycloak.svc.cluster.local
  usages:
    - server auth
  issuerRef:
    name: lab-ca
    kind: ClusterIssuer
    group: cert-manager.io
