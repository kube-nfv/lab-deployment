# Creates the Kube-VIM v1 OAuth scopes in realm nfv and gives osm-ro all of them (the NFVO set) as
# default scopes; kube-vim checks one scope per operation. A Job, not the realm import: a realm import
# that lists clientScopes skips Keycloak's built-in scopes, and imports never update an existing realm.
# Idempotent; the TTL lets every apply re-run it.
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-nfv-scopes
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        node.kubernetes.io/location: cloud
      tolerations:
        - key: node.kubernetes.io/location
          operator: Equal
          value: cloud
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        # curl_user in the curlimages image; a numeric UID lets the kubelet check non-root
        runAsUser: 100
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: set-scopes
          image: docker.io/curlimages/curl:8.11.1
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: CLIENT_ID
              value: osm-ro
            - name: SCOPES
              value: >-
                image:v1:add image:v1:query image:v1:update image:v1:delete
                flavour:v1:create flavour:v1:query flavour:v1:delete
                network:v1:allocate network:v1:query network:v1:update network:v1:terminate
                compute:v1:allocate compute:v1:query compute:v1:update compute:v1:terminate
                compute:v1:operate compute:v1:scale compute:v1:migrate
                storage:v1:allocate storage:v1:query storage:v1:update storage:v1:terminate
                storage:v1:operate storage:v1:scale storage:v1:migrate
            - name: ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: keycloak-bootstrap-admin
                  key: username
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-bootstrap-admin
                  key: password
          command:
            - sh
            - -euc
            - |
              KC=https://keycloak-service.keycloak.svc:8443
              API="$KC/admin/realms/nfv"
              TOKEN=$(curl -sf --cacert /ca/ca.crt -d grant_type=password -d client_id=admin-cli \
                --data-urlencode "username=$ADMIN_USER" --data-urlencode "password=$ADMIN_PASSWORD" \
                "$KC/realms/master/protocol/openid-connect/token" | sed -n 's/.*"access_token":"\([^"]*\)".*/\1/p')
              test -n "$TOKEN"
              api() { curl -sf --cacert /ca/ca.crt -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' "$@"; }
              # id of the object named $2 (field $1) in a JSON array on stdin
              id_of() { tr '{' '\n' | grep "\"$1\":\"$2\"" | sed -n 's/.*"id":"\([^"]*\)".*/\1/p' | head -n1; }
              CLIENT=$(api "$API/clients?clientId=$CLIENT_ID" | id_of clientId "$CLIENT_ID")
              test -n "$CLIENT"
              for s in $SCOPES; do
                ID=$(api "$API/client-scopes" | id_of name "$s")
                if [ -z "$ID" ]; then
                  api -X POST "$API/client-scopes" -d "{\"name\":\"$s\",\"protocol\":\"openid-connect\",\"attributes\":{\"include.in.token.scope\":\"true\",\"display.on.consent.screen\":\"false\"}}"
                  ID=$(api "$API/client-scopes" | id_of name "$s")
                fi
                test -n "$ID"
                api -X PUT "$API/clients/$CLIENT/default-client-scopes/$ID"
                echo "$CLIENT_ID has $s"
              done
          volumeMounts:
            - name: ca
              mountPath: /ca
              readOnly: true
      volumes:
        - name: ca
          secret:
            secretName: keycloak-tls
            items:
              - key: ca.crt
                path: ca.crt
