kube-vim:
  vim:
    image:
      pullPolicy: Always
    nodeSelector:
      node.kubernetes.io/location: cloud
    tolerations:
    - key: node.kubernetes.io/location
      operator: Equal
      value: cloud
      effect: NoSchedule

    service:
      type: LoadBalancer
      loadBalancerClass: tailscale
      annotations:
        tailscale.com/proxy-class: default-proxy-class
        tailscale.com/hostname: setup02-kube-vim-grpc
    
    metrics:
      serviceMonitor:
        enabled: true
        # Prometheus (kube-prometheus-stack) only selects ServiceMonitors labeled
        # release=monitoring; without this the SM is created but never scraped.
        labels:
          release: monitoring

    config:
      monitoring:
        enabled: true
        metricsPort: 9095
      image:
        storageClass: local
      compute:
        tolerations:
        - key: node.kubernetes.io/location
          operator: Equal
          value: edge
          effect: NoSchedule
      network:
        managementNetwork:
          enabled: true
          name: osm-mgmt
          cidr: 10.240.0.0/24

  gateway:
    nodeSelector:
      node.kubernetes.io/location: cloud
    tolerations:
    - key: node.kubernetes.io/location
      operator: Equal
      value: cloud
      effect: NoSchedule

    ingress:
      enabled: true
      className: tailscale
      annotations:
        tailscale.com/proxy-class: default-proxy-class
      hosts:
      - host: setup02-kube-vim.tailac05db.ts.net
        paths:
        - path: /
          pathType: Prefix
      tls:
      - hosts:
        - setup02-kube-vim.tailac05db.ts.net
