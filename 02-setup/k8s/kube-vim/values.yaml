kube-vim:
  global:
    image:
      # Dev build of kube-vim#48 (OAuth 2.0 auth); back to the chart appVersion once released
      tag: dev-c89995e-oidc

  vim:
    image:
      pullPolicy: Always
    nodeSelector:
      node.kubernetes.io/location: cloud
    tolerations:
    - key: node.kubernetes.io/location
      operator: Equal
      value: cloud
      effect: NoSchedule

    service:
      type: LoadBalancer
      loadBalancerClass: tailscale
      annotations:
        tailscale.com/proxy-class: default-proxy-class
        tailscale.com/hostname: setup02-kube-vim-grpc

    # Certificates from certificates.yaml (lab-ca ClusterIssuer)
    tls:
      secretName: kube-vim-tls

    # Bearer tokens from the Keycloak nfv realm (k8s/keycloak). Its CA is the lab root,
    # the same ca.crt as kube-vim-tls.
    auth:
      enabled: true
      issuer: https://keycloak-service.keycloak.svc:8443/realms/nfv
      audience: kube-vim
      issuerCASecretName: kube-vim-tls

    metrics:
      serviceMonitor:
        enabled: true
        # Prometheus (kube-prometheus-stack) only selects ServiceMonitors labeled
        # release=monitoring; without this the SM is created but never scraped.
        labels:
          release: monitoring

    config:
      monitoring:
        enabled: true
        metricsPort: 9095
      image:
        storageClass: local
      compute:
        tolerations:
        - key: node.kubernetes.io/location
          operator: Equal
          value: edge
          effect: NoSchedule
      network:
        managementNetwork:
          enabled: true
          name: osm-mgmt
          cidr: 10.240.0.0/24

  gateway:
    nodeSelector:
      node.kubernetes.io/location: cloud
    tolerations:
    - key: node.kubernetes.io/location
      operator: Equal
      value: cloud
      effect: NoSchedule

    tls:
      secretName: kube-vim-gateway-tls

    # Port 443 makes the Tailscale ingress proxy speak TLS to the gateway; the pod stays on 8080
    service:
      port: 443
      portName: https

    ingress:
      enabled: true
      className: tailscale
      annotations:
        tailscale.com/proxy-class: default-proxy-class
      hosts:
      - host: setup02-kube-vim.tailac05db.ts.net
        paths:
        - path: /
          pathType: Prefix
      tls:
      - hosts:
        - setup02-kube-vim.tailac05db.ts.net
