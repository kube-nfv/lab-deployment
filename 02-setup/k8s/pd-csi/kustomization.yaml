apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - https://github.com/kubernetes-sigs/gcp-compute-persistent-disk-csi-driver/deploy/kubernetes/overlays/stable-master?ref=v1.27.4
  - storageclass.yaml

patches:
  # Restrict the node DaemonSet to cloud nodes; swap /etc/udev for an emptyDir (Talos)
  - path: node-daemonset-patch.yaml
    target:
      kind: DaemonSet
      name: csi-gce-pd-node
  # Restrict the controller to cloud nodes (needs the GCE metadata service for auth)
  # and drop the cloud-sa secret in favour of the instance service account
  - path: controller-deployment-patch.yaml
    target:
      kind: Deployment
      name: csi-gce-pd-controller
