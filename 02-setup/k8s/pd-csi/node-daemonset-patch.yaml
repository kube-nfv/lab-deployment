apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: csi-gce-pd-node
  namespace: gce-pd-csi-driver
spec:
  template:
    spec:
      nodeSelector:
        node.kubernetes.io/location: cloud
      tolerations:
        - key: node.kubernetes.io/location
          operator: Equal
          value: cloud
          effect: NoSchedule
      # /etc/udev does not exist on Talos; the driver never uses it at runtime
      volumes:
        - name: udev-rules-etc
          hostPath: null
          emptyDir: {}
