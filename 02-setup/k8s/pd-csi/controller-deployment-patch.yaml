apiVersion: apps/v1
kind: Deployment
metadata:
  name: csi-gce-pd-controller
  namespace: gce-pd-csi-driver
spec:
  template:
    spec:
      nodeSelector:
        node.kubernetes.io/location: cloud
      tolerations:
        - key: node.kubernetes.io/location
          operator: Equal
          value: cloud
          effect: NoSchedule
      # Use the instance service account (metadata server) instead of a cloud-sa key
      containers:
        - name: gce-pd-driver
          env:
            - name: GOOGLE_APPLICATION_CREDENTIALS
              $patch: delete
          volumeMounts:
            - mountPath: /etc/cloud-sa
              $patch: delete
        - name: taint-controller
          env:
            - name: GOOGLE_APPLICATION_CREDENTIALS
              $patch: delete
          volumeMounts:
            - mountPath: /etc/cloud-sa
              $patch: delete
      volumes:
        - name: cloud-sa-volume
          $patch: delete
