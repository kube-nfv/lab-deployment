# DNSMasq for the setup02-pxe Docker network: DHCP, DNS, TFTP for iPXE

interface=eth0
except-interface=lo
bind-dynamic

# Domain configuration; upstream DNS comes from the container's resolv.conf
domain=setup02.local
local=/setup02.local/
address=/ipxe.setup02.local/10.0.20.3

# DHCP pool, clear of Docker's own allocations (10.0.20.0/28)
dhcp-range=10.0.20.100,10.0.20.200,12h
dhcp-option=option:router,10.0.20.1
dhcp-option=option:dns-server,10.0.20.2

# TFTP: <arch>/ipxe.efi built by 02-setup/ipxe
enable-tftp
tftp-root=/var/lib/tftpboot

# First round (UEFI firmware): hand out the iPXE binary for the client arch
dhcp-match=set:efi-x86_64,option:client-arch,7
dhcp-match=set:efi-x86_64,option:client-arch,9
dhcp-match=set:efi-arm64,option:client-arch,11
dhcp-userclass=set:ipxe,iPXE
dhcp-boot=tag:!ipxe,tag:efi-x86_64,x86_64/ipxe.efi
dhcp-boot=tag:!ipxe,tag:efi-arm64,arm64/ipxe.efi

# Second round (iPXE): chainload the script server over mTLS
dhcp-boot=tag:ipxe,https://ipxe.setup02.local/boot.ipxe

log-queries
log-dhcp
