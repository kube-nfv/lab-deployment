# Stub iPXE script server: mTLS with the 02-Setup CA, serves boot.ipxe and Talos assets
log_format mtls '$remote_addr "$request" $status $body_bytes_sent client="$ssl_client_s_dn" verify=$ssl_client_verify';

server {
    listen 443 ssl;
    server_name ipxe.setup02.local;

    # Leaf + CA: iPXE embeds only the CA fingerprint, so the server must send the CA cert
    ssl_certificate        /etc/nginx/tls/ipxe-server-chain.crt;
    ssl_certificate_key    /etc/nginx/tls/ipxe-server.key;
    ssl_client_certificate /etc/nginx/tls/ca.crt;
    ssl_verify_client      on;
    ssl_protocols          TLSv1.2 TLSv1.3;

    access_log /dev/stdout mtls;
    root /srv;
    default_type application/octet-stream;

    location = /boot.ipxe {
        default_type text/plain;
    }
}
