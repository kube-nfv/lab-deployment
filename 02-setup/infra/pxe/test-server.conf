# Stub iPXE script server: mTLS with the 02-Setup Boot CA, serves boot.ipxe and Talos assets
log_format mtls '$remote_addr "$request" $status $body_bytes_sent client="$ssl_client_s_dn" verify=$ssl_client_verify';

server {
    listen 443 ssl;
    server_name ipxe.setup02.local;

    # Leaf + Boot CA: iPXE embeds only the Boot CA fingerprint, so the server must send it
    ssl_certificate        /etc/nginx/tls/ipxe-server-chain.crt;
    ssl_certificate_key    /etc/nginx/tls/ipxe-server.key;
    # Boot CA + root: OpenSSL needs the chain up to the self-signed root
    ssl_client_certificate /etc/nginx/tls/client-ca.crt;
    ssl_verify_client      on;
    ssl_protocols          TLSv1.2 TLSv1.3;

    # The root also signs the Cluster CA; accept only clients issued by the Boot CA
    if ($ssl_client_i_dn !~ "CN=02-Setup Boot CA") {
        return 403;
    }

    access_log /dev/stdout mtls;
    root /srv;
    default_type application/octet-stream;

    location = /boot.ipxe {
        default_type text/plain;
    }
}
